<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شمعة الشتاء · Ayar ∞</title>
<!-- 🕯️ الشمعة نفسها حرفياً من صفحة الشتاء (WN.HTML): الجسم والفتيل واللهب والثلج وضغطة الإشعال.
     بلا نصوص ولا شعار ولا روابط ولا خريطة. -->
<style>
:root{ --bg:#f7f7fb; --text:#1a1d24; }
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{ background:transparent;color:var(--text); overflow:hidden; display:grid; place-items:center; }
#snow{position:fixed;inset:0;z-index:55;pointer-events:none}

/* --- الشمعة --- */
.candle{ appearance:none;background:none;border:none;padding:0;cursor:pointer; width:min(50vw,220px);height:min(50vw,220px); position:relative;border-radius:50%; background:radial-gradient(circle at 50% 40%, #fffefc 0%, #f7f2e8 55%, #e5ded4 100%); box-shadow: 0 20px 40px #00000025, inset 0 -10px 18px #d3cec7, inset 0 10px 20px #ffffffcc; outline:1px solid color-mix(in oklab,var(--text) 12%,transparent); z-index:50; touch-action:none; transition:transform .3s ease; }
.wick{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:8px;height:46px;border-radius:8px;background:#3c3c3c;box-shadow:inset 0 -3px 0 #2a2a2a;}
.flame{ position:absolute;top:4px;left:50%; transform:translate(-50%,-24px) scale(0); width:34px;height:58px;border-radius:50% 50% 42% 42%; background:radial-gradient(ellipse at 50% 60%,#fff6c7,#ffca52 60%,#ff9a3c 90%); filter:blur(.25px) drop-shadow(0 0 22px #ffde6a) drop-shadow(0 0 44px #ffde6a); transform-origin:50% 100%; animation:flame .12s infinite alternate ease-in-out; }
@keyframes flame{to{transform:translate(-50%,-24px) scale(1.05) rotate(-1.5deg)}}
.candle.lit .flame{transform:translate(-50%,-24px) scale(1)}
</style>
</head>
<body>
<canvas id="snow"></canvas>

<button id="candle" class="candle" aria-label="أشعل الشمعة"><span class="wick"></span><span id="flame" class="flame" hidden></span></button>

<script>
const root=document.documentElement;

// الثلج
(function(){const c=document.getElementById('snow');if(!c)return;const ctx=c.getContext('2d');let W,H,flakes=[];
  function r(){c.width=W=innerWidth;c.height=H=innerHeight;flakes=Array.from({length:Math.min(260,W*H/14000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.9+.7,s:Math.random()+0.35}));}
  function d(){ctx.clearRect(0,0,W,H);ctx.fillStyle=root.classList.contains('dark')?"rgba(255,255,255,.95)":"rgba(255,255,255,.70)";
  flakes.forEach(f=>{f.y+=f.s;if(f.y>H)f.y=-6;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.28);ctx.fill()});requestAnimationFrame(d)}
  addEventListener('resize',r);r();d();})();

// الشمعة
const candle=document.getElementById('candle'), flame=document.getElementById('flame');
candle.addEventListener('click', ()=>{
  if(candle.classList.contains('lit')) return;
  candle.classList.add('lit'); flame.hidden=false;
});
</script>
</body>
</html>
